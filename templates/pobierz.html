{% extends "base.html" %}
{% set cel = GOOGLE_PLAY_URL or glowna ~ '#pobierz' %}
{% block tytul %}{{ T.pobierz_strona.tytul }}{% endblock %}
{% block glowa %}
  <meta name="robots" content="noindex">
  <noscript><meta http-equiv="refresh" content="0; url={{ cel }}"></noscript>
  <script>
    {% include "_wykryj_jezyk.js" %}
    (function (A, sklep) {
      if (sklep) { location.replace(sklep); return; }
      location.replace(A[sbJezyk(A, false) || "{{ DOMYSLNY }}"] + "#pobierz");
    })({{ odpowiedniki | tojson }}, {{ GOOGLE_PLAY_URL | tojson }});
  </script>
{% endblock %}
{% block tresc %}
<section class="sekcja">
  <div class="wrap waski srodek">
    <p>{{ T.pobierz_strona.tekst | wstaw(cel=cel) | safe }}</p>
  </div>
</section>
{% endblock %}
