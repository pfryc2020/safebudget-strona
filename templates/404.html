{% extends "base.html" %}
{% block tytul %}{{ T.blad404.tytul }}{% endblock %}
{% block glowa %}<meta name="robots" content="noindex">{% endblock %}
{% block tresc %}
<section class="sekcja">
  <div class="wrap waski srodek">
    <h1>404</h1>
    <p id="b404-tekst">{{ T.blad404.tekst }}</p>
    <p><a class="przycisk-drugi" id="b404-wroc" href="{{ glowna }}">{{ T.blad404.wroc }}</a></p>
  </div>
</section>
{% endblock %}
{% block skrypty %}
<script>
  {% include "_wykryj_jezyk.js" %}
  /* GitHub Pages pokazuje ten sam plik 404.html pod każdym błędnym adresem — dobierz język do adresu albo gościa. */
  (function (A, B, J) {
    var z = location.pathname.split("/")[1];
    var j = A[z] && z !== "{{ DOMYSLNY }}" ? z : (sbJezyk(A, false) || "{{ DOMYSLNY }}");
    if (j === "{{ DOMYSLNY }}") return;
    document.documentElement.lang = J[j][0];
    document.documentElement.dir = J[j][1];
    document.title = B[j].tytul;
    document.getElementById("b404-tekst").textContent = B[j].tekst;
    var w = document.getElementById("b404-wroc");
    w.textContent = B[j].wroc;
    w.href = A[j];
  })({{ odpowiedniki | tojson }}, {{ bledy404 | tojson }},
     {{ kierunki | tojson }});
</script>
{% endblock %}
